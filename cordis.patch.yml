# dsh-video-learn —— bundle patch（配置默认值）
#
# 用户可在自己 profile 的 cordis.patch.yml 里按同一个 id 覆盖任意字段，例如：
#   - id: dsh-video-learn
#     name: dsh-video-learn
#     config:
#       storage: notion
#
# 改完配置需重启 DSH（bundle 层重启才重新组装）。
- insert:
    - id: dsh-video-learn
      name: dsh-video-learn
      config:
        enabled: true
        # local = 只写本地（公开包的安全默认）；notion = 内置写入器；command = 外部脚本
        storage: local
        project: 视频学习
        # 留空则回落 环境变量 NOTION_TOKEN / ~/.dsh/notion.json
        notionToken: ''
        notionParentPageId: ''
        # storage=command 时用，例："node C:/tools/sync-wrapper.mjs"（正文经 --bodyfile 传入）
        syncCommand: ''
        syncTimeoutMs: 600000
        reviewDailyHours: 24
        recallLimit: 5
        # B站深读是否抽帧看画面（贵的一步，但它是"真看到画面"的唯一途径）
        withFrames: true
        biliTimeoutMs: 1800000
